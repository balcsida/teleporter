[package]
name = "teleport-split"
version = "0.1.0"
edition = "2024"
description = "Split tunneling for UniFi Teleport (WiFiman)"

[dependencies]
base64 = "0.23.1"
boringtun = "0.7.1"
flate2 = "1.1.11"
getrandom = "0.4.3"
hmac = "0.13.0"
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tun-rs = { version = "2.8.18", features = ["interruptible"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["native-tls", "handshake"] }
ureq = { version = "3.5.2", default-features = false, features = ["native-tls"] }
